[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-handoff-language"
version = "0.2.0"
description = "Experimental boundary-and-handoff language for the A/B programming layer"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
abhl = "abhl.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
